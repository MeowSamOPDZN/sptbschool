<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bag — SPTB.</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="cart">
<header class="site-header" id="site-header"></header>
<main>
  <section class="wrap" style="padding-top:64px">
    <div class="page-head" style="padding:0 0 8px"><h1>Your bag</h1></div>
  </section>
  <section class="section" style="padding-top:28px">
    <div class="wrap cart-layout">
      <div id="cart-items"></div>
      <div id="cart-summary-wrap">
        <div class="summary">
          <div class="sum-row"><span>Subtotal</span><span id="sum-sub">$0.00</span></div>
          <div class="sum-row"><span>Shipping</span><span id="sum-ship">$0.00</span></div>
          <div class="sum-row total"><span>Total</span><span id="sum-total">$0.00</span></div>
          <a class="btn btn-full" href="/checkout" style="margin-top:18px">Check out</a>
          <p class="sum-note" id="ship-note"></p>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/app.js" defer></script>
<script type="module" src="/firebase-init.js"></script>
</body>
</html>
