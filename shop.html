<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop — SPTB.</title>
<meta name="description" content="Shop all SPTB. essentials.">
<link rel="stylesheet" href="/styles.css">
<style>
.pill-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
.pill{border:1px solid var(--line);background:#fff;border-radius:980px;padding:9px 20px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>
<body data-page="shop">
<header class="site-header" id="site-header"></header>
<main>
  <section class="wrap" style="padding-top:64px">
    <div class="page-head" style="padding:0 0 8px">
      <h1>Shop all</h1>
      <p>Eight essentials. Nothing more, nothing less.</p>
    </div>
  </section>
  <section class="section" style="padding-top:36px">
    <div class="wrap">
      <div class="pill-row">
        <button class="pill active" data-filter="all">All</button>
        <button class="pill" data-filter="apparel">Apparel</button>
        <button class="pill" data-filter="essentials">Essentials</button>
      </div>
      <div class="grid" id="shop-grid"></div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/app.js" defer></script>
<script type="module" src="/firebase-init.js"></script>
</body>
</html>
