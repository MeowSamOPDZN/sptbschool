<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — SPTB.</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="checkout">
<header class="site-header" id="site-header"></header>
<main class="wrap">
  <section class="page-head"><h1>Checkout</h1></section>
  <section class="section" style="padding-top:20px">
    <div class="cart-layout">
      <div id="co-form-wrap">
        <div class="card">
          <div id="auth-wall" style="display:none">
            <div class="demo-note" style="font-size:15px;margin:0">Please <a href="/signin?next=/checkout" style="color:var(--blue);font-weight:700">sign in</a> to complete your order. Your orders are saved to your account.</div>
          </div>
          <form id="checkout-form" style="display:none" novalidate>
            <div class="form-err" id="co-err"></div>
            <h2 class="sec-title" style="font-size:19px;margin-bottom:16px">Contact</h2>
            <div class="field"><label for="co-email">Email</label><input id="co-email" type="email" autocomplete="email"></div>
            <h2 class="sec-title" style="font-size:19px;margin:26px 0 16px">Shipping address</h2>
            <div class="field-row">
              <div class="field"><label for="co-name">Full name</label><input id="co-name" type="text" autocomplete="name"></div>
              <div class="field"><label for="co-country">Country</label><input id="co-country" type="text" autocomplete="country-name"></div>
            </div>
            <div class="field"><label for="co-address">Address</label><input id="co-address" type="text" autocomplete="street-address" placeholder="Street and number"></div>
            <div class="field-row">
              <div class="field"><label for="co-city">City</label><input id="co-city" type="text" autocomplete="address-level2"></div>
              <div class="field"><label for="co-zip">ZIP / Postal code</label><input id="co-zip" type="text" autocomplete="postal-code"></div>
            </div>
            <h2 class="sec-title" style="font-size:19px;margin:26px 0 16px">Payment</h2>
            <div class="demo-note">Demo checkout — no real payment is processed. Connect a payment provider to take live payments.</div>
            <div class="field"><label for="co-card">Card number</label><input id="co-card" type="text" inputmode="numeric" placeholder="4242 4242 4242 4242"></div>
            <div class="field-row">
              <div class="field"><label for="co-exp">Expiry</label><input id="co-exp" type="text" placeholder="MM / YY"></div>
              <div class="field"><label for="co-cvc">CVC</label><input id="co-cvc" type="text" inputmode="numeric" placeholder="123"></div>
            </div>
            <button class="btn btn-full" id="place-order" type="submit" style="margin-top:8px">Place order</button>
          </form>
        </div>
      </div>
      <div>
        <div class="summary">
          <div id="co-items"></div>
          <div id="cp-zone-checkout" style="margin-top:6px"></div>
          <div class="sum-row" style="margin-top:12px"><span>Subtotal</span><span id="co-sub">$0.00</span></div>
          <div class="sum-row" id="co-disc-row" style="display:none"><span>Coupon</span><span class="disc" id="co-disc"></span></div>
          <div class="sum-row"><span>Shipping</span><span id="co-ship">$0.00</span></div>
          <div class="sum-row total"><span>Total</span><span id="co-total">$0.00</span></div>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="/app.js" defer></script>
<script type="module" src="/firebase-init.js"></script>
</body>
</html>
